# Render Blueprint — one-click deploy of the MOOV Health Check website.
#
# In the Render dashboard: New → Blueprint → pick this repo. Render reads this
# file, builds the app, and gives you a public https URL. No credit card needed
# for the free plan.
#
# ⚠️ Free plan note: the free web service has an *ephemeral* disk and sleeps
# after ~15 min idle, so the JSON data (groups, tasks, updates) resets on
# redeploy/restart. Two safety nets are built in:
#   • every page the head views auto-saves a full desk backup into their
#     browser, and the sign-in page offers one-click "Restore my desk"
#     whenever the server comes back empty;
#   • all state (including the groups file) lives in $MOOV_DATA_DIR, never in
#     the repo, so a redeploy can't silently reset it to demo content.
# For guaranteed permanence, uncomment the `disk:` block below (Render disks
# are a paid add-on) and point MOOV_DATA_DIR at the mounted volume.
services:
  - type: web
    name: moov-health-check
    runtime: python
    plan: free
    buildCommand: pip install -e .
    startCommand: moov-health-check serve
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Where the app keeps its data. With a persistent disk (below), point
      # this at the mount path so nothing is lost between deploys.
      - key: MOOV_DATA_DIR
        value: reports
      # --- Email sign-in codes (optional) — see EMAIL_SETUP.md ---
      # Add these in the Render dashboard (Environment tab) so codes get
      # emailed instead of shown on screen. Example values for Resend:
      #   MOOV_SMTP_HOST=smtp.resend.com   MOOV_SMTP_PORT=587
      #   MOOV_SMTP_USER=resend            MOOV_SMTP_PASS=<your Resend API key>
      #   MOOV_SMTP_FROM=onboarding@resend.dev   MOOV_SMTP_FROM_NAME=MOOV
    # --- Uncomment for permanent storage (paid disk) ---
    # disk:
    #   name: moov-data
    #   mountPath: /var/moov
    #   sizeGB: 1
    # and set MOOV_DATA_DIR to /var/moov above.
